[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multidb-mcp"
version = "0.1.0"
description = "Lightweight MCP server for SQL Server and Dameng (DM8) databases"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "dmPython>=2.5",
    "pymssql>=2.2",
    "pyodbc>=5.0",
]

[project.scripts]
multidb-mcp = "multidb_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
